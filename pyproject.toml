[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgework"
version = "1.0.0"
description = "Deterministic diagnostic layer for financial model variance attribution (Shapley + sequential bridge)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "SALib>=1.4",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
bridgework = "bridgework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# BLE001: broad `except Exception` is intentional at I/O boundaries
#   (workbook loading, git subprocess) -- these are genuinely "anything
#   could go wrong reading this file" cases, not swallowed logic errors.
# ISC001/ISC004: false positives on intentional multi-line f-string lists
#   used to build report/log text.
ignore = ["BLE001", "ISC001", "ISC004"]
