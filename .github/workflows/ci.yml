name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ tests/

      - name: Test
        run: pytest tests/ -v --tb=short
